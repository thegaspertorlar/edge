<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#09151a" />
    <meta
      name="description"
      content="EDGE — Her adım bir karar. Gözcülerden kaç, engelleri aş ve ışığa ulaş."
    />
    <title>EDGE</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <button class="wordmark" id="home" aria-label="Ana menü">EDGE</button>
        <div class="top-actions">
          <button class="icon" id="sound" aria-label="Sesi kapat" title="Ses">
            ♪</button
          ><button class="icon" id="help" aria-label="Nasıl oynanır?">?</button>
        </div>
      </header>
      <main>
        <div class="eyebrow" id="eyebrow" hidden></div>
        <div id="gamebar" hidden>
          <button id="levelBack" class="small-link">Bölümler</button>
          <div class="metrics">
            <span>HAMLE <b id="moves">0</b></span
            ><i></i><span>EN KISA <b id="par">8</b></span>
          </div>
          <button class="icon" id="pause" aria-label="Oyunu duraklat">Ⅱ</button>
        </div>
        <div class="arena" id="arena">
          <canvas
            id="board"
            aria-label="Oyun tahtası. Yön tuşları veya komşu karelere dokunarak hareket et."
            tabindex="0"
          ></canvas>
        </div>
        <div id="homeControls">
          <div class="difficulty" role="group" aria-label="Zorluk">
            <button class="selected" data-diff="0">Kolay</button
            ><button data-diff="1">Orta</button
            ><button data-diff="2">Zor</button>
          </div>
          <button class="primary" id="play">
            OYNA <span class="play-icon">▷</span></button
          ><button class="text-btn" id="levelsOpen">
            Bölümler <span>01 — 12</span>
          </button>
        </div>
        <div id="playControls" hidden>
          <p class="status" id="status" aria-live="polite"></p>
          <div class="play-buttons">
            <button class="secondary" id="hint">
              ✧ <span>İpucu</span><small id="hints">3</small></button
            ><button class="secondary" id="restart">
              ↻ <span>Yeniden</span>
            </button>
          </div>
        </div>
      </main>
    </div>
    <div class="modal-backdrop" id="modal" hidden>
      <section
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <button class="icon close" id="closeModal" aria-label="Kapat">×</button>
        <div id="modalBody"></div>
      </section>
    </div>
    <script src="engine.js"></script>
    <script src="levels.js"></script>
    <script src="app.js"></script>
  </body>
</html>
